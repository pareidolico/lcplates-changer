; PlateChanger settings
;
; Key: the hotkey that starts (and finishes) editing.
;   F1..F12, a single letter or digit, with optional Ctrl+ / Alt+ / Shift+
;   Examples:  Key=F11   Key=Shift+F11   Key=Ctrl+P
;   Note: Liberty's Legacy trainer also opens with F11.
;
; MaxPicture: the highest plateN picture number in libertycityplates.wtd.
; MaxFont:    the highest lettersN font number.
;   Page Up/Down and Home/End wrap around between 0 and these.
[PlateChanger]
Key=F11
MaxPicture=24
MaxFont=4
