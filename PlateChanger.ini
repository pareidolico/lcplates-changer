; PlateChanger settings
;
; Key: the hotkey that opens the "Change plate" box.
;   F1..F12, a single letter or digit, with optional Ctrl+ / Alt+ / Shift+
;   Examples:  Key=F11   Key=Shift+F11   Key=Ctrl+P
;
; Note: Liberty's Legacy trainer also opens with F11. If both react,
; change this to something like Shift+F11.
[PlateChanger]
Key=F11
