; PlateChanger settings
;
; Key: the hotkey that starts (and finishes) editing.
;   F1..F12, a single letter or digit, with optional Ctrl+ / Alt+ / Shift+
;   Examples:  Key=F11   Key=Shift+F11   Key=Ctrl+P
;   Note: Liberty's Legacy trainer also opens with F11.
;
; MaxPicture / MaxFont: leave blank and Page Up/Down and Home/End step
;   through the plate pictures and fonts your vehicles.ide license_plates
;   lines use (so added plates are picked up automatically). Set a number to
;   step through 0..that number instead.
;
; RememberPlates: 1 = keep the plates you set on your cars (saved in
;   PlateChanger.plates next to this file), 0 = don't.
;
; PlatesIde: the vehicles.ide with your license_plates presets, relative to
;   the game folder. Blank = update\common\data\vehicles.ide, then
;   common\data\vehicles.ide.
[PlateChanger]
Key=F11
MaxPicture=
MaxFont=
RememberPlates=1
PlatesIde=
