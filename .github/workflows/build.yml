name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # lets tag builds publish a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ziglang pefile
      - run: ./build.sh
      - name: Test file handling
        run: ./tests/run.sh
      - name: Check the plugin
        run: |
          python - <<'PY'
          import pefile
          pe = pefile.PE("build/PlateChanger.asi")
          assert pe.FILE_HEADER.Machine == 0x14c, "not 32-bit x86"
          assert pe.is_dll(), "not a DLL"
          dlls = sorted(e.dll.decode().lower() for e in pe.DIRECTORY_ENTRY_IMPORT)
          assert set(dlls) <= {"kernel32.dll", "user32.dll", "gdi32.dll"}, dlls  # Windows' own DLLs only
          print("ok:", dlls)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PlateChanger
          path: |
            build/PlateChanger.asi
            PlateChanger.ini
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist/PlateChanger
          cp build/PlateChanger.asi PlateChanger.ini README.md LICENSE dist/PlateChanger/
          cd dist && zip -r "PlateChanger-${GITHUB_REF_NAME}.zip" PlateChanger
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PlateChanger-${{ github.ref_name }}.zip
          body_path: RELEASE_NOTES.md
